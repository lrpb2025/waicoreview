<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact - World Artificial Intelligence Cooperation Organization ("WAICO") Review</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <a class="back-link" href="index.html">&larr; Back to Home</a>

  <main>
  <h1>Contact</h1>

  <form id="contact-form">
    <!-- Honeypot field: hidden from real visitors, but bots often fill it in automatically -->
    <div style="position: absolute; left: -9999px;" aria-hidden="true">
      <label for="website-url">Leave this field blank</label>
      <input type="text" id="website-url" name="website-url" tabindex="-1" autocomplete="off">
    </div>

    <label for="surname">Surname</label>
    <input type="text" id="surname" name="surname" required>

    <label for="givenName">Given Name</label>
    <input type="text" id="givenName" name="givenName" required>

    <label for="organization">Organization</label>
    <input type="text" id="organization" name="organization">

    <label for="region">Region</label>
    <select id="region" name="region">
      <option value="">Select a region</option>
      <option value="Global">Global</option>
      <option value="Northern Africa">Northern Africa</option>
      <option value="Sub-Saharan Africa">Sub-Saharan Africa</option>
      <option value="Northern America">Northern America</option>
      <option value="Latin America">Latin America</option>
      <option value="Caribbean">Caribbean</option>
      <option value="Central Asia">Central Asia</option>
      <option value="Eastern Europe">Eastern Europe</option>
      <option value="Northern Europe">Northern Europe</option>
      <option value="Southern Europe">Southern Europe</option>
      <option value="Western Europe">Western Europe</option>
      <option value="Australia and New Zealand">Australia and New Zealand</option>
      <option value="Melanesia">Melanesia</option>
      <option value="Micronesia">Micronesia</option>
      <option value="Polynesia">Polynesia</option>
    </select>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="jobTitle">Job Title</label>
    <input type="text" id="jobTitle" name="jobTitle">

    <label for="website">Website</label>
    <input type="url" id="website" name="website" placeholder="https://">
<p> <input type="checkbox" id="dpaAgreed" name="dpaAgreed" required> <label for="dpaAgreed">I have read and agree to the <a href="data-protection.html" target="_blank">Data Protection Agreement</a></label> </p>
<p> <input type="checkbox" id="shareConsent" name="shareConsent"> <label for="shareConsent">I agree that my name and contact details may be made visible to other Participants for the purpose of the Review, in accordance with clauses 5.3 and 7.2 of the Data Protection Agreement (optional)</label> </p>
    <button type="submit">Send</button>
    <p id="form-status"></p>
  </form>
  </main>

  <script>
  document.getElementById('contact-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const status = document.getElementById('form-status');
    status.textContent = 'Sending...';

    const data = {
      surname: this.surname.value,
      givenName: this.givenName.value,
      organization: this.organization.value,
      region: this.region.value,
      email: this.email.value,
      jobTitle: this.jobTitle.value,
      website: this.website.value,
      'website-url': this['website-url'].value,
    };

    try {
      const res = await fetch('/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });

      if (res.ok) {
        status.textContent = 'Thank you — your submission has been sent.';
        this.reset();
      } else {
        status.textContent = 'Something went wrong. Please try again.';
      }
    } catch (err) {
      status.textContent = 'Something went wrong. Please try again.';
    }
  });
  </script>

</body>
</html>
